[project]
name = "velicor"
version = "0.1.0"
description = "High-performance log ingestion and search layer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2.0.0",
    "pydantic-settings",
    "zstandard",
    "aiofiles",
    "orjson",
    "python-multipart",
    "requests",
    "asyncpg",
    "python-dotenv",
    "motor",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt",
    "redis",
    "pyotp",
    "pytest",
    "httpx",
    "boto3>=1.28.0",
    "duckdb>=0.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "BLE", "RET", "PL", "RUF"]
ignore = ["E501", "PLR2004", "BLE001", "PLC0415", "RUF006", "PLR0912", "PLR0913", "PLR0915", "PLR0911", "PLW0603"]

